<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我在哪</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --bar:#f4f4f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --muted:#aaa; --bar:#222; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px -apple-system, "PingFang TC", sans-serif; }
  #bar { padding:10px 16px; background:var(--bar); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #info { flex:1; min-width:180px; }
  #info small { color:var(--muted); }
  button, select { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid #8884; background:var(--bg); color:var(--fg); cursor:pointer; }
  #map { position:absolute; top:56px; bottom:0; left:0; right:0; }
  @media (max-width:520px) { #map { top:96px; } }
</style>
</head>
<body>
<div id="bar">
  <div id="info">定位中…（瀏覽器會問要不要分享位置，按「允許」）</div>
  <select id="theme" aria-label="地圖風格">
    <option value="liberty">原色</option>
    <option value="parchment">羊皮紙古地圖</option>
    <option value="neon">夜間霓虹</option>
    <option value="sketch">黑白素描</option>
  </select>
  <button id="again">重新定位</button>
</div>
<div id="map"></div>
<script>
// 每個風格：背景、陸地綠地、水、建築、道路、文字、文字外框
const THEMES = {
  parchment: { bg:'#efe2c4', green:'#d9cfa0', water:'#a9c1c0', building:'#dccaa3', road:'#b0855a', text:'#5a3b1e', halo:'#efe2c4' },
  neon:      { bg:'#0b0b1a', green:'#10241c', water:'#081a33', building:'#1d1d3a', road:'#ff2bd6', text:'#7df9ff', halo:'#0b0b1a' },
  sketch:    { bg:'#ffffff', green:'#f1f1f1', water:'#dcdcdc', building:'#e6e6e6', road:'#333333', text:'#111111', halo:'#ffffff' },
};
const STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
let baseStyle;

function themed(name) {
  const s = structuredClone(baseStyle);
  const t = THEMES[name];
  if (!t) return s;
  for (const l of s.layers) {
    const id = l.id, p = (l.paint ||= {});
    if (l.type === 'background') p['background-color'] = t.bg;
    else if (l.type === 'fill') {
      p['fill-color'] = /water|ocean|lake|river/.test(id) ? t.water
        : /building/.test(id) ? t.building
        : /park|wood|forest|grass|landcover|landuse|green/.test(id) ? t.green : t.bg;
      delete p['fill-pattern'];
    }
    else if (l.type === 'fill-extrusion') p['fill-extrusion-color'] = t.building;
    else if (l.type === 'line') p['line-color'] = /water|river|stream|canal/.test(id) ? t.water : t.road;
    else if (l.type === 'symbol' && l.layout && l.layout['text-field']) {
      p['text-color'] = t.text; p['text-halo-color'] = t.halo; p['text-halo-width'] = 1.2;
      if (name === 'sketch' || name === 'neon') delete l.layout['icon-image'];
    }
  }
  return s;
}

const map = new maplibregl.Map({ container:'map', style:STYLE_URL, center:[0,20], zoom:1.5 });
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.once('styledata', () => { baseStyle = map.getStyle(); });

let here; // { lng, lat, acc }
const info = document.getElementById('info');

function circle(lng, lat, m) {
  const pts = [], R = 6378137;
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * 2 * Math.PI;
    const dx = m * Math.cos(a), dy = m * Math.sin(a);
    pts.push([lng + dx / (R * Math.cos(lat * Math.PI / 180)) * 180 / Math.PI, lat + dy / R * 180 / Math.PI]);
  }
  return { type:'Feature', geometry:{ type:'Polygon', coordinates:[pts] } };
}

function drawHere() {
  if (!here || !map.isStyleLoaded()) return;
  const data = { type:'FeatureCollection', features:[
    circle(here.lng, here.lat, here.acc),
    { type:'Feature', geometry:{ type:'Point', coordinates:[here.lng, here.lat] } } ] };
  if (map.getSource('here')) { map.getSource('here').setData(data); return; }
  map.addSource('here', { type:'geojson', data });
  map.addLayer({ id:'here-acc', type:'fill', source:'here', filter:['==','$type','Polygon'],
    paint:{ 'fill-color':'#2e9e5b', 'fill-opacity':0.18 } });
  map.addLayer({ id:'here-acc-line', type:'line', source:'here', filter:['==','$type','Polygon'],
    paint:{ 'line-color':'#2e9e5b', 'line-width':2 } });
  map.addLayer({ id:'here-dot', type:'circle', source:'here', filter:['==','$type','Point'],
    paint:{ 'circle-radius':7, 'circle-color':'#2e9e5b', 'circle-stroke-color':'#fff', 'circle-stroke-width':2 } });
}
map.on('styledata', drawHere);

document.getElementById('theme').onchange = e => {
  if (!baseStyle) return;
  map.setStyle(themed(e.target.value));
  map.once('idle', drawHere);
};

function locate() {
  info.textContent = '定位中…';
  navigator.geolocation.getCurrentPosition(p => {
    const { latitude: lat, longitude: lng, accuracy: acc } = p.coords;
    here = { lng, lat, acc };
    drawHere();
    const b = new maplibregl.LngLatBounds();
    circle(lng, lat, acc).geometry.coordinates[0].forEach(c => b.extend(c));
    map.fitBounds(b, { padding:40, maxZoom:18 });
    info.innerHTML = `誤差約 ${Math.round(acc)} 公尺 <small>（${new Date(p.timestamp).toLocaleTimeString()}）</small>`;
  }, e => { info.textContent = '定位失敗：' + e.message; },
  { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}
document.getElementById('again').onclick = locate;
locate();
</script>
</body>
</html>
